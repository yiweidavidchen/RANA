[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rana-ncaa-site-recommender"
version = "0.1.0.dev0"
description = "Structure-aware site recommendation for non-canonical amino acid incorporation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yiwei Chen"}]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rana = "ncaa_site_rec.cli:main"

[tool.setuptools.packages.find]
include = ["ncaa_site_rec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
